    <script>
        // Automatic Clean URL Redirector for GitHub Pages
        (function() {
            var path = window.location.pathname;
            // Check if path is missing .html extension
            if (!path.endsWith('.html') && !path.endsWith('/') && path.indexOf('.') === -1) {
                var newPath = path + '.html' + window.location.search + window.location.hash;
                window.location.replace(newPath);
            }
        })();
    </script>
