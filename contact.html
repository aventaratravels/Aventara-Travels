<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Aventara Travels</title>
    <meta name="description" content="Contact Aventara Travels to plan your journey. We are here to help create a Sri Lankan journey that feels uniquely yours.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="assets/logo/LOGO_REAL_TRANSPARENT.png" alt="Aventara Travels Logo" style="height: 60px; width: auto; object-fit: contain;">
                </a>
            </div>
            
            <nav class="nav-menu">
                <a href="about.html" class="nav-link">About Us</a>
                <a href="tours.html" class="nav-link">Tours</a>
                <a href="destinations.html" class="nav-link">Destinations</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="index.html#journey-planner" class="btn-glass" style="margin-left: 1rem;">Plan Your Journey</a>
            </nav>
            
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Contact Form Section -->
    <section class="container" style="padding: 5rem 1rem;">
        <div style="max-width: 600px; margin: 0 auto;">
            <h2>Contact Us</h2>
            <p>Fill out the form below to plan your trip with Aventara Travels.</p>
            
            <form class="enquiry-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem;">
                <div>
                    <label for="name">Your Name *</label>
                    <input type="text" id="name" name="name" required style="width: 100%; padding: 0.8rem; margin-top: 0.3rem;">
                </div>
                <div>
                    <label for="email">Your Email Address *</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 0.8rem; margin-top: 0.3rem;">
                </div>
                <div>
                    <label for="phone">Phone / WhatsApp Number</label>
                    <input type="tel" id="phone" name="phone" style="width: 100%; padding: 0.8rem; margin-top: 0.3rem;">
                </div>
                <div>
                    <label for="message">Message / Journey Details *</label>
                    <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 0.8rem; margin-top: 0.3rem;"></textarea>
                </div>

                <div class="form-message" style="display: none; padding: 1rem; border-radius: 4px; font-weight: 500;"></div>

                <button type="submit" class="btn btn-primary" style="padding: 1rem; cursor: pointer;">SEND ENQUIRY</button>
            </form>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
